    Experience:
      - company: "Northeastern University"
        position: "Associate Research Scientist, Khoury College of Computer Sciences"
        start_date: "2026-02"
        end_date: "present"
        summary: "Researcher in the Gyori Lab at Northeastern University, focusing on natural language processing and biomedical informatics with an emphasis on information extraction from scientific literature."
        highlights:
          - "Develop models and datasets for information extraction in the biomedical domain."
          - "Mentor graduate students whose focus of research includes Natural Language Processing."
          - "Engage and liaise on behalf of Gyori lab with external research groups from the lab's research projects."
      - company: "The University of Arizona"
        position: "Computational Sciences Researcher IV, Computer Science Department"
        start_date: "2022-10"
        end_date: "2026-01"
        highlights:
          - "Consult as NLP/LLM domain matter expert in research engagements between Computer Science and various academic departments."
          - "Co-develop curriculum and teach workshops for graduate students, including Exploring the LLM Frontier and AI Makerspace."
          - "Lead and collaborate on research projects about information retrieval, extraction, document modeling, program synthesis, etc."
          - "Write and publish research work on top-tier, peer-reviewed venues."
          - "Collaborate with planning and writing extramural research grants and other funding mechanisms."
          - "Participate in the organization of academic workshops."
          - "Mentor graduate students."
      - company: "The University of Arizona"
        position: "Postdoctoral Research Associate, Computer Science Department"
        start_date: "2021-01"
        end_date: "2022-09"
        highlights:
          - "Collaborated on the development of five research publications in top-tier peer-reviewed venues."
          - "Led a collaborative effort to develop a multi-disciplinary visual analytics tool for the visualization of information extraction in the biomedical domain."
          - "Contributed to open source NLP projects."
          - "Presented research projects in multiple symposiums and conferences."
          - "Collaborated on the development of two grant proposals for NSF and DARPA."
          - "Collaborated and coordinated the organization of two research workshops, one institutional and the other co-hosted at COLING '22."
          - "Mentored graduate students in the Department of Computer Science."
      - company: "CodaMetrix"
        position: "Senior NLP Scientist"
        start_date: "2020-02"
        end_date: "2020-10"
        highlights:
          - "Built a taxonomy of body regions, organs, and tissues using medical ontologies such as UMLS, SNOMED, and MeSH."
          - "Bootstrapped a dataset using proprietary EHR corpora."
          - "Implemented, trained, and tested state-of-the-art neural architectures with PyTorch and TensorFlow."
          - "Developed APIs for integration with the company's product."
          - "Participated as a mentor in the summer internship program and contributed to documentation and internal training curricula for NLP and machine learning."
      - company: "The University of Arizona"
        position: "Graduate Research Associate"
        start_date: "2013-01"
        end_date: "2020-01"
        summary: "Worked within CLU lab and ML4AI on NLP and Machine Learning projects applied to health sciences, contributing regularly to REACH, a machine reading system for biomedical publications."
      - company: "The University of Arizona"
        position: "Teaching Assistant"
        start_date: "2013-08"
        end_date: "2019-12"
        highlights:
          - "Collaborated as a teaching assistant for graduate and undergraduate courses in Computer Science and the School of Information."
          - "Graded assignments, exams, and projects, held office hours, designed assignments, and directed laboratory sessions and guest lectures."
          - "Courses served: Computer Organization (2013), Data Structures (2014), Information Retrieval and Web Search (2015, 2016), Introduction to Machine Learning (2017, 2019)."
